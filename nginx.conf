server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Todo lo que empiece con /api va al backend.
    # "backend" es el nombre del servicio en el docker-compose.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La importación de CSV puede tardar
        proxy_read_timeout 120s;
    }

    # Archivos con hash de Vite: caché larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: /catalogo, /eventos, etc. devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
